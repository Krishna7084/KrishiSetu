<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#4b5563"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1000" height="760" fill="#f8fafc"/>
  <text x="500" y="35" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">KrishiSetu — System Architecture</text>

  <!-- Client Layer -->
  <text x="500" y="75" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Client Layer</text>
  <g>
    <rect x="70"  y="90" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="170" y="125" text-anchor="middle" font-size="14" fill="#14532d">Farmer App (Mobile/Web)</text>

    <rect x="400" y="90" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="500" y="125" text-anchor="middle" font-size="14" fill="#14532d">Buyer App (B2C / B2B)</text>

    <rect x="730" y="90" width="200" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
    <text x="830" y="115" text-anchor="middle" font-size="14" fill="#14532d">Admin Dashboard /</text>
    <text x="830" y="133" text-anchor="middle" font-size="14" fill="#14532d">Logistics Partner App</text>
  </g>

  <line x1="170" y1="150" x2="480" y2="215" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="150" x2="500" y2="215" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="830" y1="150" x2="520" y2="215" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="350" y="220" width="300" height="55" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="2"/>
  <text x="500" y="253" text-anchor="middle" font-size="14" fill="#713f12">API Gateway (Auth + Routing)</text>

  <line x1="500" y1="275" x2="500" y2="310" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Services Layer -->
  <text x="500" y="305" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Services Layer (Microservices)</text>
  <g font-size="12" fill="#1e3a8a">
    <rect x="40"  y="320" width="135" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="107" y="352" text-anchor="middle">User Service</text>

    <rect x="185" y="320" width="135" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="252" y="352" text-anchor="middle">Listing Service</text>

    <rect x="330" y="320" width="135" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="397" y="345" text-anchor="middle">Pricing / AI</text>
    <text x="397" y="360" text-anchor="middle">Service</text>

    <rect x="475" y="320" width="135" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="542" y="352" text-anchor="middle">Order Service</text>

    <rect x="620" y="320" width="135" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="687" y="352" text-anchor="middle">Payment/Escrow</text>

    <rect x="765" y="320" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="812" y="345" text-anchor="middle">Logistics</text>
    <text x="812" y="360" text-anchor="middle">Service</text>

    <rect x="870" y="320" width="95" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="917" y="345" text-anchor="middle">Notification</text>
    <text x="917" y="360" text-anchor="middle">Service</text>
  </g>

  <!-- Message Queue -->
  <line x1="500" y1="375" x2="500" y2="410" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="380" y="415" width="240" height="45" rx="8" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="500" y="443" text-anchor="middle" font-size="13" fill="#4c1d95">Message Queue (Async Events)</text>

  <line x1="500" y1="460" x2="500" y2="500" stroke="#4b5563" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Data Layer -->
  <text x="500" y="500" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">Data Layer</text>
  <g font-size="13">
    <rect x="150" y="515" width="220" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="260" y="540" text-anchor="middle" fill="#7f1d1d">PostgreSQL</text>
    <text x="260" y="558" text-anchor="middle" fill="#7f1d1d">(Users, Orders, Payments)</text>

    <rect x="390" y="515" width="220" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="500" y="540" text-anchor="middle" fill="#7f1d1d">MongoDB</text>
    <text x="500" y="558" text-anchor="middle" fill="#7f1d1d">(Produce Listings)</text>

    <rect x="630" y="515" width="220" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="740" y="540" text-anchor="middle" fill="#7f1d1d">Redis</text>
    <text x="740" y="558" text-anchor="middle" fill="#7f1d1d">(Cache — Live Prices)</text>
  </g>

  <!-- External integrations -->
  <text x="500" y="620" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">External Integrations</text>
  <g font-size="12" fill="#065f46">
    <rect x="60"  y="635" width="190" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="155" y="665" text-anchor="middle">e-NAM / Agmarknet APIs</text>

    <rect x="280" y="635" width="190" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="375" y="665" text-anchor="middle">OSRM / OpenStreetMap</text>

    <rect x="500" y="635" width="190" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="595" y="665" text-anchor="middle">Google OR-Tools (VRP)</text>

    <rect x="720" y="635" width="190" height="50" rx="8" fill="#d1fae5" stroke="#059669" stroke-width="1.5"/>
    <text x="815" y="665" text-anchor="middle">Razorpay (Escrow)</text>
  </g>

  <line x1="155" y1="575" x2="155" y2="635" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="375" y1="575" x2="375" y2="635" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="595" y1="575" x2="595" y2="635" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="815" y1="575" x2="815" y2="635" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <text x="500" y="725" text-anchor="middle" font-size="12" fill="#6b7280">Modular microservices architecture — REST/GraphQL APIs + async message queue for order &amp; payment events</text>
</svg>
