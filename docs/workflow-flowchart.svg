<svg viewBox="0 0 1100 520" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#16a34a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="38" text-anchor="middle" font-size="24" font-weight="700" fill="#14532d">KrishiSetu — System Workflow</text>
  <text x="550" y="62" text-anchor="middle" font-size="13" fill="#6b7280">From farm listing to buyer delivery in six technology-mediated steps</text>

  <!-- Row 1: Steps 1-3 -->
  <g>
    <!-- Step 1 -->
    <rect x="40" y="100" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="75" cy="130" r="18" fill="#16a34a"/>
    <text x="75" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">1</text>
    <text x="105" y="135" font-size="15" font-weight="700" fill="#14532d">Farmer Onboarding</text>
    <text x="60" y="160" font-size="12" fill="#374151">Register / KYC via app or</text>
    <text x="60" y="177" font-size="12" fill="#374151">assisted kiosk; list produce</text>
    <text x="60" y="194" font-size="12" fill="#374151">with AI-assisted quality grading</text>

    <!-- Step 2 -->
    <rect x="400" y="100" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="435" cy="130" r="18" fill="#16a34a"/>
    <text x="435" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">2</text>
    <text x="465" y="135" font-size="15" font-weight="700" fill="#14532d">AI Price Recommendation</text>
    <text x="420" y="160" font-size="12" fill="#374151">Live mandi prices (e-NAM/</text>
    <text x="420" y="177" font-size="12" fill="#374151">Agmarknet) + trends + demand</text>
    <text x="420" y="194" font-size="12" fill="#374151">→ fair price suggested to farmer</text>

    <!-- Step 3 -->
    <rect x="760" y="100" width="300" height="120" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
    <circle cx="795" cy="130" r="18" fill="#16a34a"/>
    <text x="795" y="136" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">3</text>
    <text x="825" y="135" font-size="15" font-weight="700" fill="#14532d">Matching with Buyers</text>
    <text x="780" y="160" font-size="12" fill="#374151">Consumers/retailers/bulk buyers</text>
    <text x="780" y="177" font-size="12" fill="#374151">auto-matched; demand-aggregation</text>
    <text x="780" y="194" font-size="12" fill="#374151">batches small orders into bulk pickups</text>
  </g>

  <!-- Arrows row1 -->
  <line x1="340" y1="160" x2="395" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="160" x2="755" y2="160" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Connector down to row 2 -->
  <path d="M910,220 L910,260 L190,260 L190,300" fill="none" stroke="#16a34a" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Row 2: Steps 4-6 -->
  <g>
    <!-- Step 4 -->
    <rect x="40" y="300" width="300" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="75" cy="330" r="18" fill="#2563eb"/>
    <text x="75" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">4</text>
    <text x="105" y="335" font-size="15" font-weight="700" fill="#1e3a8a">Order &amp; Escrow Payment</text>
    <text x="60" y="360" font-size="12" fill="#374151">Buyer payment held in conditional</text>
    <text x="60" y="377" font-size="12" fill="#374151">escrow on order confirmation</text>

    <!-- Step 5 -->
    <rect x="400" y="300" width="300" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="435" cy="330" r="18" fill="#2563eb"/>
    <text x="435" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">5</text>
    <text x="465" y="335" font-size="15" font-weight="700" fill="#1e3a8a">Logistics &amp; Delivery</text>
    <text x="420" y="360" font-size="12" fill="#374151">VRP-based route optimisation</text>
    <text x="420" y="377" font-size="12" fill="#374151">assigns nearest logistics partner</text>

    <!-- Step 6 -->
    <rect x="760" y="300" width="300" height="120" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
    <circle cx="795" cy="330" r="18" fill="#2563eb"/>
    <text x="795" y="336" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">6</text>
    <text x="825" y="335" font-size="15" font-weight="700" fill="#1e3a8a">Feedback &amp; Analytics</text>
    <text x="780" y="360" font-size="12" fill="#374151">Ratings + sales data feed back</text>
    <text x="780" y="377" font-size="12" fill="#374151">into AI models for next cycle</text>
  </g>

  <!-- Arrows row2: continue left-to-right, 4 -> 5 -> 6 -->
  <line x1="340" y1="360" x2="395" y2="360" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow2)"/>
  <line x1="700" y1="360" x2="755" y2="360" stroke="#2563eb" stroke-width="2.5" marker-end="url(#arrow2)"/>

  <!-- Escrow release note -->
  <rect x="380" y="450" width="340" height="50" rx="10" fill="#fef9c3" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="550" y="480" text-anchor="middle" font-size="12.5" fill="#713f12">Funds released to farmer automatically after delivery + quality confirmation</text>
</svg>
